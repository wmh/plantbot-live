<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantBot - Programming Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(52, 73, 94, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease-out;
            border-radius: 12px;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading-screen p {
            margin-top: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        #loading-screen .subtitle {
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: normal;
        }
        
        #app-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
        }
        
        /* Left Panel - Game View */
        #game-panel {
            flex: 0 0 800px;
            background: #34495e;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        #game-header {
            background: #2c3e50;
            padding: 15px 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #level-info {
            color: #3498db;
        }
        
        #level-description {
            background: #34495e;
            padding: 12px 20px;
            color: #ecf0f1;
            font-size: 14px;
            font-weight: normal;
            border-bottom: 2px solid #2c3e50;
            line-height: 1.5;
        }
        
        #level-description.hidden {
            display: none;
        }
        
        /* Victory Screen Overlay */
        #victory-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 204, 113, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            border-radius: 12px;
        }
        
        #victory-screen.show {
            display: flex;
        }
        
        #victory-screen h2 {
            color: white;
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #victory-screen .next-level-btn {
            padding: 15px 40px;
            background: white;
            color: #27ae60;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            margin: 10px;
        }
        
        #victory-screen .next-level-btn:hover {
            transform: scale(1.05);
        }
        
        #victory-screen .menu-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin: 10px;
        }
        
        #victory-screen .menu-btn:hover {
            background: white;
            color: #27ae60;
            transform: scale(1.05);
        }
        
        #game-container {
            flex: 1;
        }
        
        /* Right Panel - Programming Interface */
        #code-panel {
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* Command Palette */
        #command-palette {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        #command-palette h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #commands {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .command-btn {
            aspect-ratio: 1;
            border: 2px solid #3498db;
            background: white;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            transition: all 0.2s;
            user-select: none;
        }
        
        .command-btn:hover {
            background: #ecf0f1;
            transform: scale(1.05);
        }
        
        .command-btn:active {
            cursor: grabbing;
        }
        
        .command-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .command-label {
            font-size: 10px;
            color: #7f8c8d;
            text-align: center;
        }
        
        /* Program Slots */
        .program-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            border: 6px solid white; /* Default border same as background */
        }
        
        .program-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .program-header h3 {
            color: #2c3e50;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .program-header .slot-count {
            color: #95a5a6;
            font-size: 12px;
        }
        
        .program-slots {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            min-height: 60px;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 8px;
            border: 2px dashed #bdc3c7;
        }
        
        .slot {
            aspect-ratio: 1;
            border: 2px dashed #bdc3c7;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .slot.drag-over {
            background: #d5f4e6;
            border-color: #27ae60;
        }
        
        .slot .command-btn {
            width: 100%;
            height: 100%;
            margin: 0;
            border: none;
            padding: 2px;
            box-sizing: border-box;
            cursor: grab;
        }
        
        .slot .command-btn:active {
            cursor: grabbing;
        }
        
        .slot .command-icon {
            font-size: 16px;
            margin-bottom: 2px;
            pointer-events: none;
        }
        
        .slot .command-label {
            font-size: 7px;
            pointer-events: none;
        }
        
        /* Control Buttons */
        #controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        
        .control-btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-btn.run {
            background: #27ae60;
            color: white;
        }
        
        .control-btn.run:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39,174,96,0.4);
        }
        
        .control-btn.reset {
            background: #3498db;
            color: white;
        }
        
        .control-btn.reset:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52,152,219,0.4);
        }
        
        .control-btn.clear {
            background: #95a5a6;
            color: white;
        }
        
        .control-btn.clear:hover {
            background: #7f8c8d;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Function programs - hidden by default */
        #func1-program {
            display: none;
        }
        
        #func2-program {
            display: none;
        }
        
        #func1-program .program-header h3 {
            color: #e67e22;
        }
        
        #func2-program .program-header h3 {
            color: #9b59b6;
        }
        
        /* Focus state */
        .program-section {
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .program-section.focused {
            border-color: #e74c3c; /* Red border for focus */
        }
        
        .program-section.focused::before {
            content: '▶';
            position: absolute;
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 36px;
            color: #e74c3c; /* Red arrow */
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
            50% { opacity: 0.6; transform: translateY(-50%) scale(1.1); }
        }
        
        .program-section:hover {
            box-shadow: 0 5px 25px rgba(0,0,0,0.25);
        }
        
        /* Level Selection Screen */
        #level-selection-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #level-selection-screen.hidden {
            display: none;
        }
        
        .level-selection-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .level-selection-container h1 {
            font-size: 48px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .level-selection-container .subtitle {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .level-card {
            background: #ecf0f1;
            border: 3px solid #bdc3c7;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-color: #3498db;
        }
        
        .level-card.completed {
            background: #d5f4e6;
            border-color: #27ae60;
        }
        
        .level-card.locked {
            background: #e8e8e8;
            border-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .level-card .level-number {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .level-card .level-name {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .level-card .completion-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 20px;
        }
        
        #app-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Level Selection Screen -->
    <div id="level-selection-screen">
        <div class="level-selection-container">
            <h1>🌱 PlantBot</h1>
            <p class="subtitle">Programming Puzzle Game</p>
            
            <div class="level-grid" id="level-grid">
                <!-- Levels will be dynamically generated here -->
            </div>
        </div>
    </div>
    
    <div id="app-container" class="hidden">
        <!-- Left: Game View -->
        <div id="game-panel">
            <!-- Loading Screen (inside game panel) -->
            <div id="loading-screen">
                <div class="loader"></div>
                <p>PLANTBOT</p>
                <p class="subtitle">Loading assets...</p>
            </div>
            
            <div id="game-header">
                <span>PlantBot</span>
                <span id="level-info">Level 1</span>
                <button id="dev-menu-btn" style="background: rgba(0,0,0,0.3); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">⚙️</button>
            </div>
            
            <!-- Developer Menu -->
            <div id="dev-menu" style="display: none; position: absolute; top: 50px; right: 10px; background: white; border-radius: 8px; padding: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 999;">
                <h4 style="margin: 0 0 10px 0; color: #2c3e50;">Developer Menu</h4>
                <button id="reset-progress-btn" style="width: 100%; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px;">🗑️ Reset Progress</button>
                <button id="show-levels-btn" style="width: 100%; padding: 8px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px;">📋 Level Select</button>
                <button id="toggle-coords-btn" style="width: 100%; padding: 8px; background: #9b59b6; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px;">📍 Toggle Coordinates</button>
                <button id="close-dev-menu-btn" style="width: 100%; padding: 8px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">✖️ Close</button>
            </div>
            
            <div id="level-description" class="hidden">
                Welcome to PlantBot!
            </div>
            
            <!-- Victory Screen Overlay -->
            <div id="victory-screen">
                <h2>🎉 Level Complete!</h2>
                <button class="next-level-btn" id="next-level-btn">Next Level ▶</button>
                <button class="menu-btn" id="menu-btn">🏠 Back to Menu</button>
            </div>
            
            <div id="game-container"></div>
        </div>
        
        <!-- Right: Programming Interface -->
        <div id="code-panel">
            <!-- Command Palette -->
            <div id="command-palette">
                <h3>Commands</h3>
                <div id="commands">
                    <div class="command-btn" draggable="true" data-command="forward">
                        <div class="command-icon">⬆️</div>
                        <div class="command-label">Forward</div>
                    </div>
                    <div class="command-btn" draggable="true" data-command="turn-left">
                        <div class="command-icon">↪️</div>
                        <div class="command-label">Turn Left</div>
                    </div>
                    <div class="command-btn" draggable="true" data-command="turn-right">
                        <div class="command-icon">↩️</div>
                        <div class="command-label">Turn Right</div>
                    </div>
                    <div class="command-btn" draggable="true" data-command="plant">
                        <div class="command-icon">🌱</div>
                        <div class="command-label">Plant</div>
                    </div>
                    <div class="command-btn" draggable="true" data-command="func1">
                        <div class="command-icon">F1</div>
                        <div class="command-label">Func 1</div>
                    </div>
                    <div class="command-btn" draggable="true" data-command="func2">
                        <div class="command-icon">F2</div>
                        <div class="command-label">Func 2</div>
                    </div>
                </div>
            </div>
            
            <!-- Main Program -->
            <div class="program-section" id="main-program">
                <div class="program-header">
                    <h3>Main</h3>
                    <span class="slot-count">0 / 8</span>
                </div>
                <div class="program-slots" id="main-slots" data-program="main">
                    <div class="slot" data-index="0"></div>
                    <div class="slot" data-index="1"></div>
                    <div class="slot" data-index="2"></div>
                    <div class="slot" data-index="3"></div>
                    <div class="slot" data-index="4"></div>
                    <div class="slot" data-index="5"></div>
                    <div class="slot" data-index="6"></div>
                    <div class="slot" data-index="7"></div>
                </div>
            </div>
            
            <!-- Func 1 -->
            <div class="program-section" id="func1-program">
                <div class="program-header">
                    <h3>Func 1</h3>
                    <span class="slot-count">0 / 6</span>
                </div>
                <div class="program-slots" id="func1-slots" data-program="func1">
                    <div class="slot" data-index="0"></div>
                    <div class="slot" data-index="1"></div>
                    <div class="slot" data-index="2"></div>
                    <div class="slot" data-index="3"></div>
                    <div class="slot" data-index="4"></div>
                    <div class="slot" data-index="5"></div>
                </div>
            </div>
            
            <!-- Func 2 -->
            <div class="program-section" id="func2-program">
                <div class="program-header">
                    <h3>Func 2</h3>
                    <span class="slot-count">0 / 6</span>
                </div>
                <div class="program-slots" id="func2-slots" data-program="func2">
                    <div class="slot" data-index="0"></div>
                    <div class="slot" data-index="1"></div>
                    <div class="slot" data-index="2"></div>
                    <div class="slot" data-index="3"></div>
                    <div class="slot" data-index="4"></div>
                    <div class="slot" data-index="5"></div>
                </div>
            </div>
            
            <!-- Controls -->
            <div id="controls">
                <button class="control-btn run" id="run-btn">▶️ Run</button>
                <button class="control-btn reset" id="reset-btn">↺ Reset</button>
                <button class="control-btn clear" id="clear-btn">🗑️ Clear</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
